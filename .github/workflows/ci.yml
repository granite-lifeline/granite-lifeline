name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Python syntax check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping syntax check."
          else
            git ls-files '*.py' | xargs -r uv run python -m py_compile
          fi

      - name: flake8 style check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping flake8."
          else
            git ls-files '*.py' | xargs -r uv run python -m flake8
          fi

      - name: Run pytest
        run: |
          uv run pytest -q -m "not model_download"

      - name: Run model-download tests (non-blocking)
        continue-on-error: true
        run: |
          echo "::notice::Tests marked model_download make a real network call to Hugging Face Hub on a cold cache (e.g. TTM model loading). Run separately, non-blocking, so Hub flakiness doesn't fail unrelated PRs — but a real regression here still shows as a warning below."
          uv run pytest -q -m model_download

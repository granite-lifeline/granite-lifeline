name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Python syntax check
        run: |
          files=$(find . -name "*.py" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "No Python files found. Skipping syntax check."
          else
            python -m py_compile $files
          fi

      - name: flake8 style check
        run: |
          files=$(find . -name "*.py" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "No Python files found. Skipping flake8."
          else
            python -m flake8 $files
          fi
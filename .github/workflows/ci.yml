name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Python syntax check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping syntax check."
          else
            git ls-files '*.py' | xargs -r uv run python -m py_compile
          fi

      - name: flake8 style check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping flake8."
          else
            git ls-files '*.py' | xargs -r uv run python -m flake8
          fi

      - name: Run pytest
        run: |
          uv run pytest -q

      - name: Check model_layer/ttm-related/tests/test_basic.py (non-blocking)
        continue-on-error: true
        run: |
          echo "::warning::model_layer/ttm-related/tests/test_basic.py's three tests catch exceptions internally and 'return True/False' instead of using assert/raise, so pytest's normal pass/fail signal cannot detect a real failure there (e.g. a broken TTM model load) unless it also happens to raise outside the try/except. This step re-runs just that file with the return-value warning escalated to an error, to surface the gap without failing the main build. See docs/adr/304-negation-scope-detection-design.md for context; fixing the file itself is out of scope here (Model Layer code)."
          uv run pytest model_layer/ttm-related/tests/test_basic.py -q -W error::pytest.PytestReturnNotNoneWarning

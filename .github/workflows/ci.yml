name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --locked

      - name: Python syntax check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping syntax check."
          else
            git ls-files '*.py' | xargs -r uv run python -m py_compile
          fi

      - name: flake8 style check
        run: |
          if [ -z "$(git ls-files '*.py')" ]; then
            echo "No Python files found. Skipping flake8."
          else
            git ls-files '*.py' | xargs -r uv run python -m flake8
          fi

      - name: Run pytest
        run: |
          uv run pytest -q

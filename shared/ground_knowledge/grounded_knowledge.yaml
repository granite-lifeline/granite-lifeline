  map_load_signal_plausibility_fault:
    component: "Intake manifold absolute pressure sensor / load signal"
    evidence:
      - "map"
      - "maf"
      - "rpm"
      - "tps"
      - "intake_temp"
      - "speed_density_maf_residual"
      - "map_slope"
    definition: "MAP cannot reasonably reflect load changes, or its relationship with MAF, throttle position, and engine speed is inconsistent. This proxies MAP sensor drift, blockage, hose issues, signal sticking, or load-measurement abnormalities."
    expected_pattern:
      no_map_response_to_tps_step:
        trigger:
          signal: "tps"
          condition: "step change >15 percentage points"
        observation:
          signal: "abs(map_slope)"
          condition: "close to 0"
          window: "within 1 s"
      map_maf_air_amount_deviation:
        signal: "air_amount_derived_from_map_vs_maf"
        condition: ">25-30%"
        phase: "steady-state conditions"
      fixed_unreasonable_map:
        signal: "map"
        condition: "near unreasonable fixed value"
        duration: "extended period"
        phase: "engine running"
    rationale: "Intake manifold absolute pressure is a preferred method for monitoring load, and relative charge can be determined from available measurement signals such as MAF or MAP through an intake manifold model. If MAP is distorted, load, ignition, fuel injection, and torque calculations will be biased."
    supporting_source: "Bosch Automotive Handbook"
    report_layer:
      description: null
      causes: []
      actions:
        low: []
        medium: []
        high: []

  electronic_throttle_tracking_fault:
    component: "Electronic throttle control / throttle actuator"
    evidence:
      - "accel_pedal_d"
      - "accel_pedal_e"
      - "tps"
      - "rpm"
      - "map"
      - "maf"
      - "pedal_throttle_gap"
      - "pedal_to_throttle_delay"
      - "tps_slope"
    definition: "After pedal demand increases, throttle opening does not change accordingly, or the actual throttle position remains offset from the expected value based on pedal/load for an extended period. This proxies electronic throttle actuator sticking, position-control abnormalities, or ETC entering a restricted-control mode."
    expected_pattern:
      weak_tps_response_to_pedal_increase:
        trigger:
          signal: "accel_pedal_mean"
          condition: "increase >20 percentage points"
        observation:
          signal: "tps"
          condition: "change <5 percentage points"
          window: "0.5-1.0 s"
      sustained_pedal_throttle_gap:
        signal: "pedal_throttle_gap"
        condition: ">15-20 percentage points"
        duration: "2 s"
        threshold_role: "initial_proxy_hint_not_final_decision_threshold"
        requires_dataset_baseline: true
      confidence_boost:
        - "map shows no response"
        - "maf shows no response"
    rationale: "ETC calculates throttle opening through the ECU based on pedal position and current operating conditions, and uses the throttle angle sensor to monitor whether the actual position matches the expected position. OBD diagnostic targets include the ETC throttle-valve actuator."
    supporting_source: "Bosch Automotive Handbook"
    report_layer:
      description: null
      causes: []
      actions:
        low: []
        medium: []
        high: []

  accelerator_pedal_sensor:
    component: "Accelerator pedal position sensors (dual/redundant)"
    evidence:
      - "accel_pedal_d"
      - "accel_pedal_e"
      - "accel_pedal_channel_delta"
      - "accel_pedal_channel_ratio"
      - "pedal_slope"
    definition: "The proportional relationship, correlation, or dynamic behavior between pedal channels D/E is inconsistent. This proxies pedal sensor channel drift, contact abnormalities, or redundancy-monitoring failure."
    expected_pattern:
      healthy_mapping:
        formula: "accel_pedal_e = a * accel_pedal_d + b"
        requirement: "learn dataset normal-reference mapping first"
      high_residual:
        signal: "residual(accel_pedal_e, accel_pedal_d)"
        condition: ">5-10 percentage points"
        duration: "sustained"
      low_correlation:
        signal: "corr(accel_pedal_d, accel_pedal_e)"
        condition: "<0.95"
      channel_freeze:
        condition: "one channel changes while the other channel freezes"
        duration: ">1 s"
    rationale: "The ETC system uses two potentiometers on the pedal and throttle device to provide redundancy, and continuously checks all sensors and calculations that affect throttle opening while the engine is running."
    supporting_source: "Bosch Automotive Handbook"
    report_layer:
      description: null
      causes: []
      actions:
        low: []
        medium: []
        high: []

  idle_speed_control_or_surge_degradation:
    component: "Idle-speed control / engine-speed control"
    evidence:
      - "rpm"
      - "speed"
      - "tps"
      - "accel_pedal_d"
      - "accel_pedal_e"
      - "maf"
      - "map"
      - "idle_flag"
      - "idle_rpm_stability"
      - "rpm_slope"
    definition: "Under idle conditions, RPM fluctuation is excessive, cyclic surging occurs, or the engine cannot stabilize near the target idle speed. This proxies idle-control degradation, intake/fuel-injection/ignition disturbances, excessive EGR, or insufficient load compensation."
    expected_pattern:
      idle_window:
        speed: "<3 km/h"
        tps: "<= calibrated_idle_tps_threshold"
        pedal_position: "<= calibrated_idle_pedal_threshold"
      high_rpm_std:
        signal: "std(rpm)"
        condition: ">50-100 rpm"
        duration: "30 s"
      high_peak_amplitude:
        signal: "peak_amplitude(rpm)"
        condition: ">150-200 rpm"
    rationale: "The goal of idle control is to maintain the desired idle speed under all conditions. Persistent high fluctuation within the idle window directly reflects control or combustion-stability issues."
    supporting_source: "Bosch Automotive Handbook"
    report_layer:
      description: null
      causes: []
      actions:
        low: []
        medium: []
        high: []

